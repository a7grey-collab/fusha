<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0c3b30">
<title>FUSHA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c3b30'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23c1932f'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<style>:root{--bg:#f4f6f4;--surface:#fff;--card:#fff;--soft:#eaefec;--ink:#0c3b30;--text:#26362f;--muted:#566860;--line:#d3dcd7;--gold:#c1932f;--gold-soft:#f6ecd2;--gold-ink:#7a5b10;--ok:#1f7a5a;--ok-bg:#dff3ea;--bad:#b3392f;--bad-bg:#fbe4e1;--on-ink:#fff;color-scheme:light;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Noto Serif","Times New Roman",serif;
 --arf:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1511;--surface:#12211b;--card:#162a23;--soft:#1b332b;--ink:#e6efe9;--text:#cfdcd5;--muted:#9db3a8;--line:#27433a;--gold:#d6a640;--gold-soft:#2c2711;--gold-ink:#e0b858;--ok:#4cc79a;--ok-bg:#12372a;--bad:#ff8d82;--bad-bg:#3b1c19;--on-ink:#0b1511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1511;--surface:#12211b;--card:#162a23;--soft:#1b332b;--ink:#e6efe9;--text:#cfdcd5;--muted:#9db3a8;--line:#27433a;--gold:#d6a640;--gold-soft:#2c2711;--gold-ink:#e0b858;--ok:#4cc79a;--ok-bg:#12372a;--bad:#ff8d82;--bad-bg:#3b1c19;--on-ink:#0b1511;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 var(--sans);overflow-wrap:anywhere;min-height:100vh;min-height:100dvh}
h1,h2,h3,p,ul{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ar{font-family:var(--arf);direction:rtl;unicode-bidi:isolate;letter-spacing:0}
html[lang="ar"] body{line-height:1.7}
html[lang="ar"] *{letter-spacing:0!important}
.app{max-width:30rem;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:640px){body{background:linear-gradient(160deg,#0c3b30,#0b1511)}.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.35);min-height:100vh}}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;min-height:56px;padding:.3rem .9rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:700 1.15rem var(--serif);letter-spacing:.08em;color:var(--ink);margin-inline-end:auto}
.chip{display:inline-flex;align-items:center;gap:.3rem;min-height:36px;padding:0 .7rem;border-radius:999px;background:var(--soft);font-weight:700;color:var(--ink);font-size:.95rem}
.chip svg{width:18px;height:18px}
.chip.fire svg{fill:#e8742a}.chip.bolt svg{fill:var(--gold)}
main{flex:1;padding:1rem .9rem 6.5rem}
main>*+*{margin-top:1rem}
.h1{font:700 1.5rem/1.25 var(--serif);color:var(--ink)}
.h2{font:700 1.1rem/1.3 var(--sans);color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1rem}
.card>*+*{margin-top:.55rem}
.row{display:flex;align-items:center;gap:.7rem}
.row.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:0 1.3rem;border-radius:.9rem;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:700;text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241a02}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:0 .9rem;font-size:.9rem}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:30rem;z-index:25;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{display:grid;justify-items:center;align-content:center;gap:.1rem;min-height:60px;padding:.3rem .1rem;border:0;background:none;color:var(--muted);font-size:.68rem;font-weight:700;line-height:1.15;min-width:0}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--gold)}
.tabs span{max-width:100%;text-align:center;overflow-wrap:anywhere}
/* onboarding */
.opts{display:grid;gap:.5rem}
.opt{display:flex;align-items:center;gap:.7rem;min-height:52px;padding:.5rem .9rem;border:2px solid var(--line);border-radius:.9rem;background:var(--card);text-align:start;font-weight:600}
.opt[aria-pressed="true"],.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.dots{display:flex;gap:.4rem;justify-content:center}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--line);border-radius:.9rem;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--card);font-weight:700;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
/* home */
.goal{display:flex;align-items:center;gap:1rem}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem;color:var(--ink)}
.unit{margin-top:1.4rem}
.unit h2{display:flex;align-items:center;gap:.6rem}
.uic{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.7rem;background:var(--ink);color:var(--gold);font-size:1.5rem;line-height:1;flex:none}
.plus{font:700 .7rem var(--sans);padding:.1rem .45rem;border-radius:999px;background:var(--gold);color:#241a02;letter-spacing:.04em;direction:ltr}
.path{display:grid;gap:.6rem;margin-top:.8rem}
.node{display:flex;align-items:center;gap:.8rem;min-height:64px;padding:.5rem .8rem;border:2px solid var(--line);border-radius:1rem;background:var(--card);text-align:start;width:100%}
.node .nb{flex:none;display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:700}
.node.done .nb{background:var(--ok);color:#fff}
.node.next{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.node.next .nb{background:var(--gold);color:#241a02}
.node.lock{opacity:.65}
.node svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.node .tx{min-width:0;flex:1}.node .tx b{display:block;color:var(--ink)}.node .tx span{font-size:.82rem;color:var(--muted)}
.glyphs{display:flex;gap:.3rem;flex-wrap:wrap;font-size:1.3rem;line-height:1.3}
/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.lhead{display:flex;align-items:center;gap:.8rem;padding:.6rem .9rem}
.x{flex:none;width:44px;height:44px;border-radius:.8rem;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center}
.x svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.bar{flex:1;height:.9rem;border-radius:999px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.lbody{flex:1;padding:.4rem .9rem 1rem;display:flex;flex-direction:column;gap:1rem}
.q{font:700 1.25rem/1.35 var(--serif);color:var(--ink)}
.big{display:grid;place-items:center;min-height:9rem;border-radius:1.2rem;background:var(--card);border:1px solid var(--line);font-size:5rem;line-height:1.4;color:var(--ink)}
.big.w{font-size:2.6rem;padding:.6rem}
.big .tr{font:600 .95rem var(--sans);color:var(--muted);direction:ltr}
.choices{display:grid;gap:.6rem}
.choices.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ch{min-height:56px;padding:.5rem .9rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);font-weight:600;text-align:center;line-height:1.35}
.ch.ar{font-size:1.9rem;line-height:1.5;font-weight:400}
.ch.sel{border-color:var(--gold);background:var(--gold-soft)}
.ch.ok{border-color:var(--ok);background:var(--ok-bg)}.ch.bad{border-color:var(--bad);background:var(--bad-bg)}
.lfoot{position:sticky;bottom:0;padding:.8rem .9rem calc(.8rem + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.lfoot.ok{background:var(--ok-bg)}.lfoot.no{background:var(--bad-bg)}
.fb{margin-bottom:.6rem;font-weight:700}.lfoot.ok .fb{color:var(--ok)}.lfoot.no .fb{color:var(--bad)}
.fb .ans{display:block;margin-top:.2rem;font-weight:600;color:var(--text)}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.match .col{display:grid;gap:.6rem;align-content:start}
.mt{min-height:56px;padding:.4rem .5rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);font-weight:600;line-height:1.3}
.mt.ar{font-size:1.6rem;font-weight:400}
.mt.sel{border-color:var(--gold);background:var(--gold-soft)}.mt.done{visibility:hidden}.mt.bad{border-color:var(--bad);background:var(--bad-bg)}
.line{min-height:64px;padding:.5rem;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem;direction:rtl;align-items:center;border-radius:.4rem}
.bank{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;direction:rtl}
.tok{min-height:48px;padding:.2rem .9rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);font-size:1.6rem;font-family:var(--arf)}
.tok.used{opacity:.25;pointer-events:none}
.typed{min-height:72px;padding:.5rem .9rem;border:2px solid var(--line);border-radius:.9rem;background:var(--card);font-size:2rem;line-height:1.6;direction:rtl;font-family:var(--arf);text-align:start;display:flex;align-items:center}
.kb{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.3rem;direction:rtl}
.kb button{min-height:44px;border-radius:.6rem;border:1px solid var(--line);background:var(--card);font:1.5rem/1 var(--arf);color:var(--ink);padding:0}
.kb button.wide{grid-column:span 2;font:600 .85rem var(--sans)}
.kb button.sp{grid-column:span 4}
.tts{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;width:100%;min-height:56px;border-radius:.9rem;border:2px solid var(--gold);background:var(--gold-soft);color:var(--ink);font-weight:700}
.tts svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rec{display:grid;gap:.7rem;justify-items:center;text-align:center}
.recb{width:84px;height:84px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center}
.recb svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recb.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(179,57,47,.2)}}
@media (prefers-reduced-motion:reduce){.recb.on{animation:none}.bar i{transition:none}}
.mock{border:2px dashed var(--gold);border-radius:1rem;padding:.8rem;background:var(--gold-soft);text-align:start}
.mock>*+*{margin-top:.4rem}
.meter{height:.6rem;border-radius:999px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}
audio{width:100%}
.res{text-align:center;padding-top:1.5rem}
.res .trophy{font-size:4rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.8rem;text-align:center}
.stat b{display:block;font:700 1.5rem var(--serif);color:var(--ink)}.stat span{font-size:.82rem;color:var(--muted)}
/* tutor */
.chat{display:grid;gap:.6rem}
.msg{max-width:88%;padding:.6rem .9rem;border-radius:1.1rem;line-height:1.45}
.msg.t{background:var(--card);border:1px solid var(--line);justify-self:start;border-end-start-radius:.3rem}
.msg.u{background:var(--ink);color:var(--on-ink);justify-self:end;border-end-end-radius:.3rem}
.msg .ar{display:block;font-size:1.5rem;line-height:1.5}
.msg .tr{display:block;font-size:.85rem;opacity:.8}
.msg.f{background:var(--gold-soft);border:1px solid var(--gold);justify-self:start;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.cbtn{min-height:44px;padding:0 1rem;border-radius:999px;border:2px solid var(--gold);background:var(--gold-soft);font-family:var(--arf);font-size:1.25rem;color:var(--ink)}
.send{display:flex;gap:.5rem}
.send input{flex:1;min-width:0;min-height:48px;padding:0 .9rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);color:var(--text);font:1.2rem var(--arf);direction:rtl}
/* plans */
.price{font:700 2rem var(--serif);color:var(--ink)}.price small{font:600 .9rem var(--sans);color:var(--muted)}
.feat{list-style:none;padding:0}.feat li{position:relative;padding-inline-start:1.5rem;margin:.35rem 0}.feat li::before{content:"✓";position:absolute;inset-inline-start:0;color:var(--ok);font-weight:700}
.soon{display:grid;gap:.4rem}.soon div{display:flex;gap:.6rem;align-items:center}.soon b{direction:ltr;color:var(--ink)}
textarea{width:100%;min-height:7rem;padding:.7rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;resize:vertical}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:48px}
.sw{flex:none;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw[aria-pressed="true"]{background:var(--ok)}.sw[aria-pressed="true"]::after{inset-inline-start:25px}
/* sheet, toast, banner */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:30rem;background:var(--surface);border-radius:1.4rem 1.4rem 0 0;padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom));display:grid;gap:.8rem}
.toast{position:fixed;inset-inline:1rem;bottom:5rem;z-index:70;margin:0 auto;max-width:24rem;padding:.7rem 1rem;border-radius:.9rem;background:var(--ink);color:var(--on-ink);text-align:center;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.banner{display:grid;gap:.4rem;padding:.8rem .9rem;background:var(--gold-soft);border-bottom:2px solid var(--gold);position:relative;z-index:21}
.banner ul{padding-inline-start:1.2rem;margin:0}.banner .row{flex-wrap:wrap}
.sign{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:.9rem;color:var(--muted);direction:ltr;justify-content:center}
.sign a{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;color:var(--gold-ink);font-weight:700;text-decoration:none}
.sign .ico{width:1.1rem;height:1.1rem;fill:currentColor}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.author{display:grid;gap:.1rem;padding:.7rem 0 .2rem;border-top:1px solid var(--line);margin-top:.4rem}
.author b{font:700 1.15rem var(--serif);color:var(--ink);line-height:1.3}
.author .acal{font-size:1.5rem;color:var(--gold-ink);line-height:1.5}
.tbtn{display:grid;gap:.15rem;text-align:start;width:100%;border-color:var(--gold);cursor:pointer;color:var(--text)}
.tbtn b{color:var(--ink)}
.tcard{align-items:center}.tcard .tx{flex:1;min-width:0;display:grid}.tcard .tx b{color:var(--ink)}
.tcard .uic{width:2.2rem;height:2.2rem;font-size:1.1rem;font-family:var(--sans);font-weight:700}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:999px;background:var(--soft);color:var(--gold-ink);font-size:.78rem;font-weight:700;flex:none}
.tag.open{background:var(--ok);color:#fff}.tag.demo{background:var(--gold);color:#241a02}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:1rem;padding:.8rem 1rem}
.lead{font-size:1.05rem}

.top button.brand{background:none;border:0;padding:0 .2rem;min-height:44px;text-align:start;cursor:pointer}

.inst{display:grid;gap:.6rem;border-color:var(--gold)}
.sheet-tall{max-height:90dvh;overflow:auto}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.steps li{display:flex;gap:.7rem;align-items:flex-start}
.steps .n{flex:none;inline-size:1.7rem;block-size:1.7rem;border-radius:50%;background:var(--gold);color:#1a1405;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.steps .shic{vertical-align:middle;color:var(--ink)}
.logo{display:flex;align-items:baseline;gap:.45rem;margin-inline-end:auto;min-width:0}.logo .brand{margin:0}.ver{font:700 .8rem var(--sans);color:var(--gold-ink);background:var(--gold-soft);border-radius:.5rem;padding:.1rem .4rem;letter-spacing:.04em}
.inst .h2{margin:0}.irow{display:flex;flex-wrap:wrap;gap:.5rem}.irow .btn{width:auto;flex:0 0 auto}
.top{flex-wrap:wrap;row-gap:.2rem}.brand,.ver{white-space:nowrap}.logo{flex:0 0 auto}.top .chip{margin-inline-start:0}.top .logo+.chip{margin-inline-start:auto}
.top{gap:.4rem;padding-inline:.7rem}.brand{font-size:1rem;letter-spacing:.05em}.top .chip{padding:0 .5rem;min-height:32px;font-size:.85rem;gap:.2rem}.top .chip svg{width:15px;height:15px}.ver{font-size:.7rem;padding:.05rem .3rem}
</style>

<script>const PWA = true;
/* ===== version ===== */
const VERSION = 6;
const CHANGELOG = [
 {v:6, ru:['Установка на экран: две небольшие кнопки «Android» и «iPhone / iPad» всегда рядом','iPhone / iPad: по нажатию показываются шаги установки'],
  en:['Add to home screen: two small buttons, “Android” and “iPhone / iPad”, always side by side','iPhone / iPad: tapping shows the install steps'],
  ar:['الإضافة إلى الشاشة: زران صغيران «Android» و«iPhone / iPad» دائمًا جنبًا إلى جنب','iPhone / iPad: عند الضغط تظهر خطوات التثبيت']},
 {v:5, ru:['Кнопки установки на экран теперь видны сразу, на первом экране','Номер версии (V5) показывается рядом с логотипом'],

const rc = {state:'idle', url:null, dur:0, peak:0};
function cleanupRec() {

  return '<h1 class="h1">' + t('me.log') + '</h1>' + CHANGELOG.slice().reverse().map(c => '<div class="card"><h2 class="h2">v' + c.v + '</h2><ul class="feat">' + (c[st.lang] || c.en).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('');
}
function onbView() {
  const dots = '<div class="dots">' + [0, 1, 2, 3].map(i => '<i class="' + (i <= ob.step ? 'on' : '') + '"></i>').join('') + '</div>';
  let body = '';
  if (ob.step === 0) body = '<p class="h1">' + t('onb.welcome') + '</p><h2 class="h2">' + t('onb.lang') + '</h2>' + segHTML('lang', st.lang, LANGS) + authorBlock() + installCard();
  if (ob.step === 1) body = '<h2 class="h1">' + t('onb.goal') + '</h2><div class="opts">' + [['talk', '💬'], ['quran', '📖'], ['work', '🎓']].map(x => '<button class="opt" data-act="goal" data-v="' + x[0] + '" aria-pressed="' + (st.goal === x[0]) + '"><span>' + x[1] + '</span>' + t('goal.' + x[0]) + '</button>').join('') + '</div>';
  if (ob.step === 2) body = '<h2 class="h1">' + t('onb.level') + '</h2><div class="opts">' + [['zero', 'level.zero'], ['letters', 'level.letters'], ['some', 'level.some']].map(x => '<button class="opt" data-act="level" data-v="' + x[0] + '" aria-pressed="' + (st.level === x[0]) + '">' + t(x[1]) + '</button>').join('') + '</div>';
  if (ob.step === 3) body = '<h2 class="h1">' + t('onb.daily') + '</h2><div class="opts">' + [10, 20, 40].map(n => '<button class="opt" data-act="daily" data-v="' + n + '" aria-pressed="' + (st.daily === n) + '">' + t('daily.' + n) + '</button>').join('') + '</div>';
  const last = ob.step === 3;
  return '<div class="app"><header class="top"><span class="logo"><span class="brand">FUSHA</span>' + VTAG + '</span></header><main>' + dots + body + '<div class="row" style="margin-top:1.5rem">' + (ob.step ? '<button class="btn ghost" data-act="onbback">' + t('onb.back') + '</button>' : '') + '<button class="btn gold" style="margin-inline-start:auto" data-act="' + (last ? 'onbdone' : 'onbnext') + '">' + t(last ? 'onb.start' : 'onb.next') + '</button></div></main></div>';
}

/* ----- lesson ----- */
const KB = 'ابتثجحخدذرزسشصضطظعغفقكلمنهويةءأى';
function exBody(ex) {
  let q = '', body = '';
  const dis = ls.ans ? ' disabled' : '';
  const choice = () => '<div class="choices' + (ex.arOpt ? ' g2' : '') + '">' + ex.o.map((o, i) => {
    let c = 'ch' + (ex.arOpt ? ' ar' : '') + (ls.sel === i ? ' sel' : '');
    if (ls.ans) { if (o.ok) c = 'ch' + (ex.arOpt ? ' ar' : '') + ' ok'; else if (ls.sel === i) c = 'ch' + (ex.arOpt ? ' ar' : '') + ' bad'; }
    return '<button class="' + c + '" data-act="opt" data-i="' + i + '"' + dis + '>' + (ex.arOpt ? '<span class="ar" lang="ar" dir="rtl">' + esc(o.l) + '</span>' : esc(o.l)) + '</button>';
  }).join('') + '</div>';
  switch (ex.k) {
    case 'sound': q = tp('ex.sound'); body = '<div class="big ar">' + esc(ex.it.ar) + '</div>' + choice(); break;
    case 'letter': q = tp('ex.letter', {name:ex.it.name}); body = choice(); break;
    case 'tr': q = tp('ex.tr'); body = '<div class="big w"><span class="ar">' + esc(ex.it.ar) + '</span><span class="tr">' + esc(ex.it.tr) + '</span></div>' + choice(); break;
    case 'pickar': q = tp('ex.pickar', {w:glOf(ex.it)}); body = choice(); break;
    case 'listen': q = tp('ex.listen'); body = '<button class="tts" data-act="say" data-t="' + esc(ex.it.ar) + '">' + IC.spk + ' ' + t('tts.play') + '</button>' + choice(); break;
    case 'order': {
      q = tp('ex.order', {w:glOf(ex.it)});
      body = '<div class="line">' + ls.pick.map((ti, n) => '<button class="tok" data-act="untok" data-n="' + n + '"' + dis + '>' + esc(ex.tokens[ti].w) + '</button>').join('') + '</div><div class="bank">' +
        ex.tokens.map((tk, i) => '<button class="tok' + (ls.pick.includes(i) ? ' used' : '') + '" data-act="tok" data-i="' + i + '"' + dis + '>' + esc(tk.w) + '</button>').join('') + '</div>';
      break; }
    case 'type': {
      q = tp('ex.type', {w:glOf(ex.it)});
      body = '<div class="typed" lang="ar" dir="rtl">' + esc(ls.typed) + '</div><div class="kb">' + KB.split('').map(c => '<button data-act="key" data-c="' + c + '"' + dis + '>' + c + '</button>').join('') + '<button class="sp" data-act="key" data-c=" "' + dis + '>␣</button><button class="wide" data-act="bksp" style="grid-column:span 4"' + dis + '>⌫</button></div>';
      break; }
    case 'match': {
      q = tp('ex.match'); if (!ls.m) ls.m = {L:null, R:null, done:{}, bad:null, mistake:false, busy:false}; const m = ls.m;
      const cell = (id, side) => { const it = ITEMS[id]; const done = m.done[id]; const sel = m[side] === id; const bad = m.bad && m.bad[side] === id;
        return '<button class="mt' + (side === 'L' ? ' ar' : '') + (sel ? ' sel' : '') + (done ? ' done' : '') + (bad ? ' bad' : '') + '" data-act="m' + side + '" data-id="' + id + '">' + (side === 'L' ? '<span class="ar" lang="ar" dir="rtl">' + esc(it.ar) + '</span>' : esc(labelOf(it))) + '</button>'; };
      body = '<div class="match"><div class="col">' + ex.left.map(id => cell(id, 'L')).join('') + '</div><div class="col">' + ex.right.map(id => cell(id, 'R')).join('') + '</div></div>';
      break; }
    case 'speak':
      q = tp('ex.speak'); body = '<div class="big w"><span class="ar" style="font-size:' + (ex.it.type === 'L' ? '4.5rem' : '2.6rem') + '">' + esc(ex.it.ar) + '</span><span class="tr">' + esc(ex.it.type === 'L' ? sndOf(ex.it) : ex.it.tr) + '</span></div><button class="tts" data-act="say" data-t="' + esc(ex.it.ar) + '">' + IC.spk + ' ' + t('tts.play') + '</button><div class="rec" id="recbox">' + recHTML() + '</div>';
      break;
  }
  return '<h1 class="q">' + esc(q) + '</h1>' + body;
}
function lessonView() {
  if (!ls) { setTimeout(() => go('home'), 0); return ''; }
  if (ls.done) {
    const r = ls.result;
    return '<div class="app"><main class="res"><div class="trophy" aria-hidden="true">🏆</div><h1 class="h1">' + t('res.done') + '</h1><div class="stats"><div class="stat"><b>' + t('res.xp', {n:r.xp}) + '</b></div><div class="stat"><b>' + r.acc + '%</b><span>' + tp('res.acc', {n:''}).replace(/:\s*%?$/, '') + '</span></div></div>' +
      (r.learned ? '<p class="muted">' + t('res.learned', {n:r.learned}) + '</p>' : '') + '<p class="muted">' + t('res.streak', {n:r.streak}) + '</p><button class="btn gold block" data-act="resdone">' + t('res.back') + '</button></main></div>';
  }
  const ex = curEx(), pct = Math.round(ls.i / ls.queue.length * 100);
  let foot = '';
  if (ls.ans) {
    const a = ls.ans;
    foot = '<div class="lfoot ' + (a.ok ? 'ok' : 'no') + '"><div class="fb">' + (a.ok ? '✓ ' + t('fb.ok') : '✗ ' + t('fb.no') + '<span class="ans">' + (ex.arOpt || ex.k === 'order' || ex.k === 'type' ? ar(a.correct) : esc(a.correct)) + '</span>') + '</div><button class="btn block" data-act="next">' + t('btn.cont') + '</button></div>';
  } else if (ex.k === 'speak') foot = '<div class="lfoot"><button class="btn block" data-act="skipnext">' + t(rc.state === 'done' ? 'btn.cont' : 'btn.skip') + '</button></div>';
  else if (ex.k === 'match') foot = '';
  else {
    const can = ex.o ? ls.sel !== null : ex.k === 'order' ? ls.pick.length > 0 : ls.typed.trim().length > 0;
    foot = '<div class="lfoot"><button class="btn block" data-act="check"' + (can ? '' : ' disabled') + '>' + t('btn.check') + '</button></div>';
  }
  return '<div class="app lesson"><div class="lhead"><button class="x" data-act="quit" aria-label="' + esc(tp('lesson.leave')) + '">' + IC.x + '</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div></div><div class="lbody">' + exBody(ex) + '</div>' + foot + '</div>';
}
function sheetHTML() {
  if (!sheet) return '';
  if (sheet === 'insios' || sheet === 'instand') return installSheet();
  if (sheet === 'quit') return '<div class="scrim" data-act="sheetx"><div class="sheet" role="dialog" aria-modal="true"><p class="h2">' + t('lesson.quit') + '</p><button class="btn gold block" data-act="stay">' + t('lesson.stay') + '</button><button class="btn ghost block" data-act="leave">' + t('lesson.leave') + '</button></div></div>';
  if (sheet === 'reset') return '<div class="scrim" data-act="sheetx"><div class="sheet" role="dialog" aria-modal="true"><p class="h2">' + t('me.reset.q') + '</p><button class="btn ghost block" data-act="sheetx">' + t('lesson.stay') + '</button><button class="btn block" style="background:var(--bad);border-color:var(--bad)" data-act="resetyes">' + t('me.reset') + '</button></div></div>';
  return '<div class="scrim" data-act="sheetx"><div class="sheet" role="dialog" aria-modal="true"><p class="h2">' + t('sheet.title') + '</p><p class="muted">' + t(sheet === 'tutor' ? 'sheet.tutor' : 'sheet.unit') + '</p><button class="btn gold block" data-act="seeplans">' + t('sheet.see') + '</button><button class="btn ghost block" data-act="sheetx">' + t('sheet.later') + '</button></div></div>';
}

/* ---------- install + updates ---------- */
const VTAG = '<span class="ver" dir="ltr">V' + VERSION + '</span>';
const HOSTED = PWA && /^https?:$/.test(location.protocol) && window.top === window;
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SHARE_IC = '<svg class="shic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
function installCard() {
  if (!HOSTED || st.installed || isStandalone()) return '';
  const A = '<button class="btn gold sm" data-act="instand">' + t('inst.android') + '</button>', I = '<button class="btn gold sm" data-act="insios">' + t('inst.ios') + '</button>';
  return '<div class="card inst"><h2 class="h2">' + t('inst.title') + '</h2><div class="irow">' + (isIOS() ? I + A : A + I) + '</div></div>';
}
function installSheet() {
  const steps = sheet === 'insios' ? ['s1', 's2', 's3', 's4'] : ['s1', 's2', 's3'], pre = sheet === 'insios' ? 'inst.ios.' : 'inst.and.';
  const li = steps.map((s, i) => '<li><span class="n">' + (i + 1) + '</span><span>' + t(pre + s) + (sheet === 'insios' && s === 's2' ? ' ' + SHARE_IC : '') + '</span></li>').join('');
  const done = sheet === 'insios' ? '<button class="btn gold block" data-act="instdone">' + t('inst.ios.done') + '</button>' : '';
  return '<div class="scrim" data-act="sheetx"><div class="sheet sheet-tall" role="dialog" aria-modal="true"><p class="h2">' + t(pre + 'title') + '</p><ol class="steps">' + li + '</ol>' + done + '<button class="btn ghost block" data-act="sheetx">' + t('inst.close') + '</button></div></div>';
}
function installAndroid() {
  if (!deferred) { sheet = 'instand'; render(); return; }
  const ev = deferred; deferred = null;
  ev.prompt();
  ev.userChoice.then(c => { if (c && c.outcome === 'accepted') markInstalled(); }).catch(() => {});
}
function markInstalled() { if (st.installed) return; st.installed = true; save(); sheet = null; toast(tp('inst.ok')); render(); }
function checkUpdate() {
  if (!HOSTED) return;
  fetch('version.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(j => {
    if (j && +j.version > VERSION && newVer !== +j.version) { newVer = +j.version; banner = 'new'; if (route() !== 'lesson' && route() !== 'reading') render(); }
  }).catch(() => {});
}
if (HOSTED) {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', markInstalled);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setInterval(checkUpdate, 600000);
  checkUpdate();
}

/* ---------- render ---------- */
function render() {
  const de = document.documentElement;
  de.lang = st.lang; de.dir = st.lang === 'ar' ? 'rtl' : 'ltr';
  if (st.theme === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', st.theme);
  let r = route();
  if (!st.onboarded) r = 'onb';
  else if (r === 'onb') r = 'home';
  let html;
  if (r === 'onb') html = onbView();
  else if (r === 'lesson') html = lessonView();
  else {
    const map = {home:homeView, review:reviewView, tutor:tutorView, me:meView, pay:payView, log:logView, tracks:tracksView, reading:readingView};
    const fn = map[r] || homeView;
    const tabCur = r === 'pay' || r === 'log' ? 'me' : (r === 'tracks' || r === 'reading') ? 'home' : (map[r] ? r : 'home');
    html = '<div class="app">' + bannerHTML() + topBar() + '<main>' + fn() + '</main>' + tabs(tabCur) + '</div>';
  }
  $('#root').innerHTML = html + sheetHTML();
  document.title = 'FUSHA';
  afterRender(r);
}
function afterRender(r) {
  if (r === 'tutor' && tut) { const c = $('#chat'); if (c) c.lastElementChild && c.lastElementChild.scrollIntoView({block:'nearest'}); }
  if (r === 'lesson' && ls && !ls.done && !ls.ans) { const ex = curEx(); if (ex.k === 'listen' && !ls.spoken) { ls.spoken = true; if (TTS) say(ex.it.ar); } }
  const n = $('#notes'); if (n) n.addEventListener('input', () => { st.notes = n.value; save(); });
}

/* ---------- events ---------- */
function copyText(txt) {
  const fallback = () => { try { const a = document.createElement('textarea'); a.value = txt; a.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); document.body.removeChild(a); return ok; } catch (e) { return false; } };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast(tp('toast.copied')), () => toast(fallback() ? tp('toast.copied') : tp('toast.sel')));
  else toast(fallback() ? tp('toast.copied') : tp('toast.sel'));
}
function matchTap(side, id) {
  const m = ls.m; if (m.done[id] || m.busy) return;
  m[side] = id;
  if (m.L && m.R) {
    if (m.L === m.R) { m.done[m.L] = 1; m.L = m.R = null; if (Object.keys(m.done).length === curEx().items.length) { grade(!m.mistake); return; } }
    else { m.mistake = true; m.bad = {L:m.L, R:m.R}; m.busy = true; render(); setTimeout(() => { m.bad = null; m.L = m.R = null; m.busy = false; render(); }, 450); return; }
  }
  render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'sheetx' && e.target.closest('.sheet') && !e.target.closest('button')) return;
  switch (a) {
    case 'nav': sheet = null; go(d.to); window.scrollTo(0, 0); break;
    case 'lang': st.lang = d.v; save(); render(); break;
    case 'theme': st.theme = d.v; save(); render(); break;
    case 'daily': st.daily = +d.v; save(); render(); break;
    case 'goal': st.goal = d.v; render(); break;
    case 'level': st.level = d.v; render(); break;
    case 'onbnext': ob.step++; render(); break;
    case 'onbback': ob.step--; render(); break;
    case 'onbdone': st.onboarded = true; st.seen = VERSION; save(); go('home'); break;
    case 'lesson': { const l = ALL_LESSONS.find(x => x.id === d.id), lock = lockOf(l); if (lock === 'plus') { sheet = 'unit'; render(); } else if (lock) toast(tp('home.locked')); else startLesson(l); break; }
    case 'opt': if (!ls.ans) { ls.sel = +d.i; render(); } break;
    case 'check': check(); break;
    case 'next': next(); break;
    case 'skipnext': ls.ans = null; next(); break;
    case 'tok': if (!ls.ans) { ls.pick.push(+d.i); render(); } break;
    case 'untok': if (!ls.ans) { ls.pick.splice(+d.n, 1); render(); } break;
    case 'key': if (!ls.ans && ls.typed.length < 40) { ls.typed += d.c; render(); } break;
    case 'bksp': if (!ls.ans) { ls.typed = ls.typed.slice(0, -1); render(); } break;
    case 'mL': case 'mR': {
      if (!ls.m) ls.m = {L:null, R:null, done:{}, bad:null, mistake:false, busy:false};
      matchTap(a === 'mL' ? 'L' : 'R', d.id); break; }
    case 'say': say(d.t); break;
    case 'track': if (d.id === 'zero') go('home'); else if (d.id === 'tajweed') { cleanupRec(); go('reading'); } else toast(tp('st.soon')); break;
    case 'sendteacher': toast(tp('read.sent')); break;
    case 'rec': recStart(); break;
    case 'recstop': recStop(); break;
    case 'quit': sheet = 'quit'; render(); break;
    case 'stay': case 'sheetx': sheet = null; render(); break;
    case 'leave': sheet = null; cleanupRec(); ls = null; go('home'); break;
    case 'resdone': ls = null; go(route() === 'lesson' ? 'home' : 'home'); break;
    case 'rev': startReview(false); break;
    case 'revall': startReview(true); break;
    case 'scen': tut = {sc:d.id, step:0, msgs:[{r:'t', say:SCEN[d.id].steps[0].say}], done:false}; render(); break;
    case 'scenreset': tut = null; render(); break;
    case 'chip': tutorSend(SCEN[tut.sc].steps[tut.step].chips[+d.i]); break;
    case 'region': st.region = d.r; save(); render(); break;
    case 'buy': st.premium = true; save(); toast(tp('toast.demo')); render(); break;
    case 'cancelplus': st.premium = false; save(); render(); break;
    case 'seeplans': sheet = null; go('pay'); break;
    case 'unlock': st.unlockAll = !st.unlockAll; save(); render(); break;
    case 'copynotes': copyText(st.notes || ''); break;
    case 'reset': sheet = 'reset'; render(); break;
    case 'resetyes': { const keep = {lang:st.lang, theme:st.theme}; st = Object.assign({}, DEF, keep, {onboarded:true, seen:VERSION}); save(); sheet = null; tut = null; ls = null; toast(tp('toast.reset')); render(); break; }
    case 'updclose': st.seen = VERSION; save(); render(); break;
    case 'reload': location.reload(); break;
    case 'instand': installAndroid(); break;
    case 'insios': sheet = 'insios'; render(); break;
    case 'instdone': markInstalled(); break;
  }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form="tutor"]'); if (!f) return; e.preventDefault(); const i = $('#tin'); tutorSend(i.value); });
document.addEventListener('keydown', e => {
  if (!ls || ls.done || route() !== 'lesson' || e.target.closest('input,textarea')) return;
  const ex = curEx();
  if (ex.k === 'type' && !ls.ans) {
    if (e.key === 'Backspace') { ls.typed = ls.typed.slice(0, -1); render(); }
    else if (e.key === 'Enter') check();
    else if (e.key.length === 1 && /[؀-ۿ ]/.test(e.key)) { ls.typed += e.key; render(); }
  } else if (e.key === 'Enter') { if (ls.ans) next(); else if (ex.o) check(); }
});
window.addEventListener('hashchange', () => { if (route() !== 'reading' && route() !== 'lesson') cleanupRec(); sheet = null; render(); });
window.addEventListener('storage', e => { if (e.key === LATEST && +e.newValue > VERSION) { newVer = +e.newValue; banner = 'new'; render(); } });
initTTS();
if (location.hash === '#/lesson' && !ls) location.hash = '#/home';
render();
window.__fusha = {get st() { return st; }, get ls() { return ls; }, buildQueue, ITEMS};
})();
</script>
</body>
